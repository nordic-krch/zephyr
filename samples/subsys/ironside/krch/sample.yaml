sample:
  description: This sample demonstrates the IronSide KRCH service for direct memory writes
  name: IronSide KRCH Service Sample

tests:
  sample.subsys.ironside.krch:
    tags:
      - ironside
      - krch
      - memory
      - spu
      - nrf54h20
    platform_allow:
      - nrf54h20dk/nrf54h20/cpuapp
    integration_platforms:
      - nrf54h20dk/nrf54h20/cpuapp
    harness: console
    harness_config:
      type: multi_line
      regex:
        - "IronSide KRCH Service Example - SPU Register Write"
        - "This sample demonstrates writing to a SPU register that only IronSide should access"
        - "Writing to SPU133.FEATURE.GRTC.CC\\[2\\] at address 0x5F991500"
        - "Successfully wrote to SPU133.FEATURE.GRTC.CC\\[2\\] = 0x12345678"
        - "KRCH service example completed - SPU register write demonstrated"
